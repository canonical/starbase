name: Update Starbase

on:
  schedule:
    # Run weekly on Sundays at 23:00 UTC.
    - cron: "0 23 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  check-starbase:
    # Starbase itself should never merge starbase/main into itself.
    if: github.repository != 'canonical/starbase'
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      needs_update: ${{ steps.check.outputs.needs_update }}
      starbase_sha: ${{ steps.check.outputs.starbase_sha }}
      pr_number: ${{ steps.find_pr.outputs.pr_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check if behind starbase/main
        id: check
        run: |
          git remote add starbase https://github.com/canonical/starbase.git
          git fetch starbase main --quiet
          STARBASE_SHA=$(git rev-parse starbase/main)
          echo "starbase_sha=$STARBASE_SHA" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$STARBASE_SHA" HEAD; then
            echo "Already up to date with starbase/main ($STARBASE_SHA)."
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "Behind starbase/main ($STARBASE_SHA)."
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find open Starbase merge PR
        id: find_pr
        if: steps.check.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Match PRs with the "PR: Merge" label or Starbase merge branch/title conventions.
          PR_JSON=$(gh pr list \
            --state open \
            --json number,headRefName,title,labels \
            --jq '
              [
                .[]
                | select(
                    (.labels | map(.name) | index("PR: Merge"))
                    or (.headRefName | startswith("work/update-starbase-"))
                    or (.title | test("update starbase"; "i"))
                  )
              ]
              | sort_by(.number)
              | last // empty
            ')

          if [ -n "$PR_JSON" ]; then
            PR_NUMBER=$(jq -r '.number' <<< "$PR_JSON")
            echo "Found open Starbase PR #$PR_NUMBER."
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "No open Starbase PR found."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
          fi

  trigger-copilot:
    needs: check-starbase
    if: needs.check-starbase.outputs.needs_update == 'true'
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Verify COPILOT_AGENT_TOKEN is configured
        env:
          AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
        run: |
          if [ -z "$AGENT_TOKEN" ]; then
            echo "::error::COPILOT_AGENT_TOKEN secret is not set. A user-to-server PAT with Copilot coding agent permissions is required."
            exit 1
          fi

      - name: Update existing Starbase PR via @copilot
        if: needs.check-starbase.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.check-starbase.outputs.pr_number }}
          STARBASE_SHA: ${{ needs.check-starbase.outputs.starbase_sha }}
        run: |
          gh pr comment "$PR_NUMBER" --body "$(cat <<EOF
          @copilot \`canonical/starbase\` \`main\` has new commits (latest: \`${STARBASE_SHA}\`).

          Please update this PR using the \`update-starbase\` skill (available at \`.github/skills/update-starbase/SKILL.md\` or https://github.com/canonical/copilot-collections/tree/main/groups/starcraft/skills/update-starbase), following its stale PR refresh workflow (\`references/refresh_stale_pr.md\`), pre-PR validation, and PR provenance comment rules. Do not mark the PR ready for review.
          EOF
          )"

      - name: Create new Copilot agent task for Starbase update
        if: needs.check-starbase.outputs.pr_number == ''
        env:
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          STARBASE_SHA: ${{ needs.check-starbase.outputs.starbase_sha }}
        run: |
          BODY=$(cat <<EOF
          Sync \`canonical/starbase\` \`main\` (latest commit: \`${STARBASE_SHA}\`) into \`${GH_REPO}\`.

          Use the \`update-starbase\` skill (available at \`.github/skills/update-starbase/SKILL.md\` or https://github.com/canonical/copilot-collections/tree/main/groups/starcraft/skills/update-starbase).

          Follow all phases of the skill:
          1. Run \`prepare_merge.sh\` (or manual merge steps) and resolve conflicts per \`references/file_ownership.md\`.
          2. Run the deletion checklist, placeholder grep, and pre-PR validation (\`make format\`, \`make lint\`, \`make docs\`, \`make test-fast\`).
          3. Open a draft PR with label \`PR: Merge\`, post provenance review comments per \`references/pr_provenance.md\`, and request a Copilot code review.
          4. Keep the PR in draft for human promotion.
          EOF
          )
          jq -n \
            --arg title "chore: update starbase" \
            --arg body "$BODY" \
            --arg repo "$GH_REPO" \
            --arg base "$DEFAULT_BRANCH" \
            '{
              title: $title,
              body: $body,
              assignees: ["copilot-swe-agent[bot]"],
              agent_assignment: {
                target_repo: $repo,
                base_branch: $base
              }
            }' | gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GH_REPO}/issues" \
            --input -
